            {

                bank: [
                    { id: 301, productIcon: "Liquid", productType: "Isi Ulang Sabun", packagingIcon: "Pouch", title: "Refill Pouch Multilayer", description: "Pouch isi ulang perpaduan plastik, foil, dan lem yang di-press kuat.", correctAnswer: "RESIDU", explanation: "Material campur aduk (multilayer plastik + logam) yang di-press kuat ini mustahil dipisah secara ekonomis. Fix sampah abadi." },

                    { id: 303, productIcon: "Powder", productType: "Pelindung Botol", packagingIcon: "Carton", title: "Honeycomb Paper Wrap", description: "Kertas kraft yang dipotong menyerupai sarang lebah untuk ganti bubble wrap.", correctAnswer: "KERTAS", explanation: "Kertas sarang lebah (honeycomb) ini gampang banget didaur ulang sama pabrik kertas. Alternatif bubble wrap yang sempurna." },
                    { id: 304, productIcon: "Cream", productType: "Serum Mahal", packagingIcon: "Bottle", title: "Kaca Cat Frosted", description: "Botol kaca bening tapi dicat buram (frosted) bahan kimia tebal biar estetik.", correctAnswer: "RESIDU", explanation: "Cat kimia pada kaca ini bakal ngotorin tungku peleburan kaca bening pabrik. Sering banget berujung ditolak dan dibuang." },
                    { id: 305, productIcon: "Cream", productType: "Pasta Gigi", packagingIcon: "Canister", title: "Tube Odol Campuran", description: "Tube odol berbahan campuran plastik dan aluminium foil.", correctAnswer: "RESIDU", explanation: "Kasusnya sama kayak pouch multilayer. Plastik yang kecampur lekat sama logam gini gak ada harganya di mata pengepul." },
                    { id: 306, productIcon: "Liquid", productType: "Air Kemasan", packagingIcon: "Bottle", title: "Botol Kaca Sablon", description: "Botol kaca tanpa label stiker, logonya disablon langsung tipis-tipis.", correctAnswer: "ANORGANIK", explanation: "Sablon tipis masih gampang leleh hilang di suhu ekstrem tungku kaca. Jauh lebih aman dibanding botol yang full dicat." }
                ]
            },
            {
                level: 4, difficulty: "Awas Greenwashing! (Very Hard)", difficultyColor: "text-orange-500 bg-orange-950/30 border-orange-500/30",
                bank: [
                    { id: 401, productIcon: "Cream", productType: "Krim Saku", packagingIcon: "Sachet", title: "Sachet Sampo 5ml", description: "Sachet kecil bahan metalized-film biar harganya murah meriah.", correctAnswer: "RESIDU", explanation: "Ukurannya terlalu kecil buat disortir mesin, dan materialnya campur aduk gak bernilai. Ujung-ujungnya berakhir numpuk di laut." },
                    { id: 402, productIcon: "Liquid", productType: "Botol Eco", packagingIcon: "Bottle", title: "Botol Bioplastik (PLA)", description: "Botol dari pati jagung berlabel 'Compostable'. Diklaim bisa hancur di tanah.", correctAnswer: "RESIDU", explanation: "Bioplastik PLA cuma hancur di pabrik kompos industri khusus (suhu >60°C). Kalo dibuang ke tong kuning malah merusak kemurnian daur ulang PET." },
                    { id: 403, productIcon: "Powder", productType: "Tisu Basah", packagingIcon: "Pouch", title: "Tisu 'Flushable'", description: "Lembaran tisu basah yang diklaim aman disiram ke kloset.", correctAnswer: "RESIDU", explanation: "Serat plastiknya nggak hancur di air dan malah bikin mampet gorong-gorong kota hingga menjadi gumpalan 'fatberg'." },
                    { id: 404, productIcon: "Cream", productType: "Krim Malam", packagingIcon: "Jar", title: "Toples Akrilik Tebal", description: "Plastik akrilik super tebal biar berat dan kelihatan kayak kaca kristal.", correctAnswer: "RESIDU", explanation: "Akrilik itu tergolong plastik keras yang nilai daur ulangnya rendah banget dan jarang banget diterima sama fasilias daur ulang." },
                    { id: 405, productIcon: "Cream", productType: "Cat Rambut", packagingIcon: "Canister", title: "Tube Amonia Cat Rambut", description: "Tube isi sisa krim pewarna rambut yang bau amonianya kuat.", correctAnswer: "B3", explanation: "Limbah sisa kimia kosmetik keras gini nggak bisa dipandang sebelah mata. Wajib dipisah ke tong merah B3 agar tidak cemari air tanah." },
                    { id: 406, productIcon: "Cream", productType: "Hand Cream", packagingIcon: "Bottle", title: "Tube Plastik Monomaterial", description: "Tube lentur dari PE murni (satu jenis plastik doang) tanpa lapisan aluminium.", correctAnswer: "ANORGANIK", explanation: "Karena murni dibuat dari satu jenis plastik aja (monomaterial), material ini masih sangat bisa dicacah and didaur ulang." }
                ]
            },
            {
                level: 5, difficulty: "The Final Boss (Expert)", difficultyColor: "text-red-500 bg-red-950/30 border-red-500/30",
                bank: [
                    { id: 501, productIcon: "Liquid", productType: "Deo Aerosol", packagingIcon: "Canister", title: "Kaleng Bertekanan Propelan", description: "Kaleng aluminium utuh dengan gas propelan bertekanan tinggi di dalamnya.", correctAnswer: "B3", explanation: "Gas bertekanan di dalamnya bisa meledak kalau masuk ke mesin pres pengolahan sampah biasa. Ini bahaya laten!" },

                    { id: 503, productIcon: "Liquid", productType: "Deodoran Roll-On", packagingIcon: "Bottle", title: "Kaca + Roller Plastik Mati", description: "Badan botol kaca, tapi bola roller plastiknya tertanam mati gak bisa dicopot.", correctAnswer: "RESIDU", explanation: "Karena konsumen gak bisa nyopot plastiknya secara manual, pecahan kaca ini dianggap terkontaminasi plastik dan sering ditolak." },
                    { id: 504, productIcon: "Liquid", productType: "Hairspray", packagingIcon: "Canister", title: "Kaleng Hairspray Semprot", description: "Kaleng aerosol bertekanan tinggi dengan sisa cairan resin lengket di dalam.", correctAnswer: "B3", explanation: "Udah bertekanan gas (bisa meledak), isinya resin kimia gampang kebakar pula. Ini limbah B3 mutlak!" },
                    { id: 505, productIcon: "Liquid", productType: "Parfum Mewah", packagingIcon: "Bottle", title: "Botol Kaca Parfum (Alkohol)", description: "Botol kaca dengan pompa semprot mati (di-press), ada sisa alkohol pekat.", correctAnswer: "B3", explanation: "Walau botol kaca, sisa parfum cair itu gampang terbakar. Ditambah pompanya nyangkut mati, membuatnya susah dibersihkan." },
                    { id: 506, productIcon: "Powder", productType: "Kopi Biji", packagingIcon: "Bottle", title: "Toples Kaca Tutup Bambu", description: "Wadah kaca tebal dengan tutup bambu asli yang gampang dilepas.", correctAnswer: "ANORGANIK", explanation: "Tutup bambunya bisa dikompos, dan kacanya 100% didaur ulang ke anorganik. Perfect combo buat sistem sirkular!" }
                ]
            }
        ];

        // --- ICONS SVG ---
        const Icons = {
            Liquid: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M12 21a5 5 0 0 0 5-5c0-3.5-5-10-5-10S7 12.5 7 16a5 5 0 0 0 5 5z"/><path d="M6 16a3 3 0 0 0 3-3c0-2-3-6-3-6S3 11 3 13a3 3 0 0 0 3 3z"/><path d="M18 16a3 3 0 0 0 3-3c0-2-3-6-3-6s-3 4-3 6a3 3 0 0 0 3 3z"/></svg>,
            Cream: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M3 18h18" /><path d="M6 18c0-3 3-5 6-5s6 2 6 5" /><path d="M9 13c0-2 2-4 4-4s3 1 3 3-2 3-4 3" /></svg>,
            Powder: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M2 20h20L12 4 2 20z" strokeLinejoin="round"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="9" cy="17" r="1" fill="currentColor"/><circle cx="15" cy="17" r="1" fill="currentColor"/></svg>,
            Pouch: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M6 20h12l1-12c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2l1 12z" /><path d="M9 6V3h3v3" /><path d="M6 20c0-1.5 2.5-2.5 6-2.5s6 1 6 2.5" opacity="0.5" /></svg>,
            Sachet: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><rect x="5" y="3" width="14" height="18" rx="1" /><path d="M5 6h14M5 18h14" /><path d="M8 3v3M12 3v3M16 3v3M8 18v3M12 18v3M16 18v3" opacity="0.5"/></svg>,
            Carton: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" strokeLinejoin="round"/><polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" y1="22.08" x2="12" y2="12" /></svg>,
            Bottle: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><rect x="7" y="8" width="10" height="14" rx="3" /><path d="M9 8V4h6v4" /><path d="M10 4V2h4v2" /></svg>,
            Jar: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M6 9v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9" /><rect x="4" y="4" width="16" height="5" rx="1" /></svg>,
            Canister: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><rect x="6" y="8" width="12" height="14" rx="2" /><path d="M8 8V5c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v3" /><path d="M12 3v2" /></svg>
        };

        const BINS = [
            { id: 'KERTAS', label: 'KERTAS', subLabel: 'Tong Biru', bgColor: 'bg-blue-50', borderColor: 'border-blue-400', hoverBg: 'hover:bg-blue-100', textColor: 'text-blue-800', icon: '📄', desc: 'Karton murni, no laminasi club' },
            { id: 'ANORGANIK', label: 'ANORGANIK', subLabel: 'Tong Kuning', bgColor: 'bg-yellow-50', borderColor: 'border-yellow-400', hoverBg: 'hover:bg-yellow-100', textColor: 'text-yellow-800', icon: '♻️', desc: 'Botol bening & Kaca. Gampang di-recycle' },
            { id: 'B3', label: 'BAHAYA / B3', subLabel: 'Tong Merah', bgColor: 'bg-red-50', borderColor: 'border-red-400', hoverBg: 'hover:bg-red-100', textColor: 'text-red-800', icon: '☠️', desc: 'Toxic, Gas & Flammable.' },
            { id: 'RESIDU', label: 'RESIDU', subLabel: 'Tong Abu-abu', bgColor: 'bg-slate-100', borderColor: 'border-slate-400', hoverBg: 'hover:bg-slate-200', textColor: 'text-slate-800', icon: '🗑️', desc: 'Multilayer & Sachet. Sampah abadi' }
        ];

        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        function App() {
            const [gameState, setGameState] = useState('START'); 
            const [activeSessionLevels, setActiveSessionLevels] = useState(() => {
                return LEVEL_DATA.map(levelObj => ({
                    ...levelObj,
                    questions: shuffleArray(levelObj.bank).slice(0, 5)
                }));
            });
            const [score, setScore] = useState(0);
            const [levelScore, setLevelScore] = useState(0); 
            const [currentLevelIndex, setCurrentLevelIndex] = useState(0);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [lastUserAnswer, setLastUserAnswer] = useState(null);
            const [lastAnswerStatus, setLastAnswerStatus] = useState(null);
            const [animatingItem, setAnimatingItem] = useState(false);
            
            // State untuk fitur simpan skor ke Spreadsheet
            const [playerName, setPlayerName] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            const startGame = () => {
                const randomizedLevels = LEVEL_DATA.map(levelObj => {
                    const shuffledQuestions = shuffleArray(levelObj.bank).slice(0, 5);
                    return { ...levelObj, questions: shuffledQuestions };
                });
                setActiveSessionLevels(randomizedLevels);
                setScore(0);
                setLevelScore(0);
                setCurrentLevelIndex(0);
                setCurrentQuestionIndex(0);
                setSubmitStatus(null);
                setPlayerName('');
                setGameState('PLAYING');
            };

            const currentLevel = activeSessionLevels[currentLevelIndex] || LEVEL_DATA[0];
            const currentQuestion = currentLevel?.questions?.[currentQuestionIndex] || LEVEL_DATA[0].bank[0];

            const handleSort = (binId) => {
                setAnimatingItem(true);
                setLastUserAnswer(binId); 
                
                setTimeout(() => {
                    if (binId === currentQuestion.correctAnswer) {
                        setScore(prev => prev + 10);
                        setLevelScore(prev => prev + 10);
                        setLastAnswerStatus('CORRECT');
                    } else {
                        setLastAnswerStatus('INCORRECT');
                    }
                    setAnimatingItem(false);
                    setGameState('FEEDBACK');
                }, 400);
            };

            const handleNextAction = () => {
                if (currentQuestionIndex < 4) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setGameState('PLAYING');
                } else {
                    setGameState('LEVEL_COMPLETE');
                }
            };

            const handleReplayLevel = () => {
                setScore(prev => Math.max(0, prev - levelScore));
                setLevelScore(0);
                setCurrentQuestionIndex(0);
                setGameState('PLAYING');
            };

            const handleNextLevel = () => {
                if (currentLevelIndex >= activeSessionLevels.length - 1) {
                    setGameState('VICTORY');
                } else {
                    setLevelScore(0);
                    setCurrentLevelIndex(prev => prev + 1);
                    setCurrentQuestionIndex(0);
                    setGameState('PLAYING');
                }
            };

            // Fungsi Mengirim Skor ke Google Sheets via Fetch API (Mode no-cors)
            const handleSaveScore = async (e) => {
                e.preventDefault();
                if (!playerName.trim()) return;
                
                setIsSubmitting(true);
                try {
                    // Menggunakan mode no-cors karena Google Apps Script redirect ke HTML/Text
                    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name: playerName,
                            score: score
                        })
                    });
                    setSubmitStatus('SUCCESS');
                } catch (error) {
                    console.error("Error submitting:", error);
                    setSubmitStatus('ERROR');
                }
                setIsSubmitting(false);
            };

            const handleShareWA = () => {
                const message = `Uji kepekaan Eco-Design kamu di *Lifecycle Design Simulator*! 🌍♻️\n\nSkor akhirku: ${score}/250.\n\nAda puluhan case kemasan yang siap mengecoh ide desainmu. Berani coba? Main sekarang di: ${window.location.href}`; 
                const encodedMessage = encodeURIComponent(message);
                window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
            };

            const ProductIcon = currentQuestion ? Icons[currentQuestion.productIcon] : null;
            const PackagingIcon = currentQuestion ? Icons[currentQuestion.packagingIcon] : null;

            return (
                <div className="min-h-screen bg-slate-900 flex justify-center items-start md:items-center p-4 sm:p-6 font-sans text-slate-800 selection:bg-emerald-200">
                    <div className="max-w-5xl w-full bg-slate-50 rounded-[2rem] shadow-2xl overflow-hidden flex flex-col border-4 border-slate-700 h-[95vh] md:h-auto">
                        
                        {(gameState === 'PLAYING' || gameState === 'FEEDBACK' || gameState === 'LEVEL_COMPLETE') && (
                            <header className="bg-slate-800 text-white p-5 sm:px-8 flex justify-between items-center border-b border-slate-700 shrink-0">
                                <div>
                                    <p className="text-sm text-slate-400 font-bold tracking-wider uppercase mb-1">Eco-Score Kamu</p>
                                    <div className="text-3xl font-black text-emerald-400">{score} <span className="text-lg font-medium text-slate-500">/ 250</span></div>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm text-slate-400 font-bold tracking-wider uppercase mb-1">Status Progres</p>
                                    <div className="font-black text-white text-xl">Level {currentLevelIndex + 1} <span className="text-slate-500 text-sm font-medium ml-1">(Kasus {currentQuestionIndex + 1}/5)</span></div>
                                </div>
                            </header>
                        )}

                        <main className="p-5 sm:p-10 flex-grow relative overflow-y-auto bg-slate-50">
                            
                            {/* LAYAR MULAI */}
                            {gameState === 'START' && (
                                <div className="text-center py-6 md:py-12 max-w-2xl mx-auto">
                                    <div className="flex justify-center space-x-8 mb-8">
                                        <div className="w-20 h-20 text-indigo-600 drop-shadow-md"><Icons.Pouch /></div>
                                        <div className="w-20 h-20 text-indigo-600 drop-shadow-md"><Icons.Jar /></div>
                                        <div className="w-20 h-20 text-indigo-600 drop-shadow-md"><Icons.Carton /></div>
                                    </div>
                                    <h1 className="text-5xl font-black text-slate-800 mb-4 tracking-tight">Lifecycle <br/><span className="text-indigo-600">Design Simulator</span></h1>
                                    <p className="text-xl text-slate-500 mb-10 font-medium leading-relaxed">Uji kepekaan Eco-Design kamu. Ada puluhan case random yang siap mengecoh ide desainmu. Let's go!</p>
                                    
                                    <div className="bg-white rounded-3xl p-6 md:p-8 mb-10 text-left border-2 border-slate-100 shadow-xl">
                                        <h2 className="font-black text-slate-800 mb-6 uppercase tracking-wider text-lg">Tong Sampah Rules:</h2>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {BINS.map(bin => (
                                                <div key={bin.id} className={`p-4 rounded-2xl flex items-center border-l-8 shadow-sm ${bin.bgColor} ${bin.borderColor}`}>
                                                    <span className="text-4xl mr-4">{bin.icon}</span>
                                                    <div>
                                                        <div className={`font-black ${bin.textColor} text-lg`}>{bin.label}</div>
                                                        <div className="text-sm text-slate-600 mt-1 font-medium">{bin.desc}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <button onClick={startGame} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-2xl py-5 rounded-2xl shadow-[0_8px_0_rgb(5,150,105)] hover:shadow-[0_4px_0_rgb(5,150,105)] hover:translate-y-1 transition-all">
                                            Mulai Simulasi (Level 1)
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* LAYAR BERMAIN */}
                            {gameState === 'PLAYING' && currentQuestion && (
                                <div className="flex flex-col h-full animate-in fade-in duration-500">
                                    <div className="flex justify-between items-center mb-6 sm:mb-8">
                                        <div className={`px-5 py-2 rounded-full border-2 text-sm font-black tracking-widest uppercase shadow-sm ${currentLevel.difficultyColor}`}>
                                            Tingkat: {currentLevel.difficulty}
                                        </div>
                                    </div>

                                    <div className={`flex-grow flex flex-col items-center justify-center mb-8 sm:mb-12 transition-transform duration-300 ${animatingItem ? 'scale-50 opacity-0 translate-y-20' : 'scale-100 opacity-100'}`}>
                                        <div className="bg-white border-2 border-slate-200 p-8 sm:p-10 rounded-[2.5rem] shadow-2xl flex flex-col items-center max-w-2xl w-full text-center relative">
                                            <div className="absolute -top-5 bg-indigo-600 text-white px-6 py-2.5 rounded-full font-black text-sm flex items-center shadow-lg uppercase tracking-wider">
                                                <span className="mr-2 opacity-80 w-5 h-5"><ProductIcon /></span>
                                                Isi: {currentQuestion.productType}
                                            </div>

                                            <h2 className="text-3xl sm:text-4xl font-black text-slate-800 leading-tight mt-4 mb-6">{currentQuestion.title}</h2>
                                            
                                            <div className="bg-indigo-50/70 p-6 md:p-8 rounded-3xl border border-indigo-100 w-full mb-8 shadow-inner">
                                                <p className="text-slate-800 text-xl md:text-2xl font-bold leading-relaxed">
                                                    "{currentQuestion.description}"
                                                </p>
                                            </div>

                                            <div className="flex flex-col items-center justify-center opacity-70">
                                                <div className="w-16 h-16 sm:w-20 sm:h-20 text-slate-400 mb-2">
                                                    {PackagingIcon && <PackagingIcon />}
                                                </div>
                                                <p className="text-xs text-slate-400 font-bold uppercase tracking-widest">Ilustrasi Desain</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-center font-black text-slate-400 uppercase tracking-widest text-sm mb-4">Takdir akhir desain ini masuk tong mana?</p>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-5">
                                            {BINS.map(bin => (
                                                <button
                                                    key={bin.id}
                                                    onClick={() => handleSort(bin.id)}
                                                    className={`group flex flex-col items-center justify-center p-5 sm:p-6 rounded-3xl border-2 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95 active:shadow-none ${bin.bgColor} ${bin.borderColor} ${bin.hoverBg}`}
                                                >
                                                    <span className="text-5xl sm:text-6xl mb-3 transform group-hover:scale-110 transition-transform duration-300 drop-shadow-sm">{bin.icon}</span>
                                                    <span className={`font-black text-lg sm:text-xl ${bin.textColor} text-center leading-tight tracking-wide mb-1`}>
                                                        {bin.label}
                                                    </span>
                                                    <span className={`font-bold text-xs sm:text-sm ${bin.textColor} opacity-60 text-center tracking-widest uppercase`}>
                                                        {bin.subLabel}
                                                    </span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* LAYAR FEEDBACK */}
                            {gameState === 'FEEDBACK' && currentQuestion && (
                                <div className="text-center space-y-6 sm:space-y-8 animate-in zoom-in-95 duration-300 py-4 max-w-2xl mx-auto">
                                    <div className={`mx-auto flex items-center justify-center w-24 h-24 sm:w-28 sm:h-28 rounded-full shadow-[0_0_40px_rgba(0,0,0,0.15)] ${lastAnswerStatus === 'CORRECT' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                                        <span className="text-5xl sm:text-6xl">{lastAnswerStatus === 'CORRECT' ? '✔️' : '❌'}</span>
                                    </div>
                                    
                                    <h2 className={`text-4xl sm:text-5xl font-black tracking-tight ${lastAnswerStatus === 'CORRECT' ? 'text-emerald-600' : 'text-red-600'}`}>
                                        {lastAnswerStatus === 'CORRECT' ? 'Slay! Tebakan Tepat' : 'Zonk! Prediksi Meleset'}
                                    </h2>

                                    <div className={`p-6 sm:p-8 rounded-[2rem] text-left border-4 shadow-xl relative overflow-hidden ${lastAnswerStatus === 'CORRECT' ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                                        <div className="flex flex-col sm:flex-row mb-6 items-center sm:items-start text-center sm:text-left gap-5 sm:gap-6">
                                            <div className={`w-24 h-24 sm:w-28 sm:h-28 rounded-3xl flex-shrink-0 border-2 flex items-center justify-center shadow-inner ${lastAnswerStatus === 'CORRECT' ? 'bg-emerald-100 border-emerald-300 text-emerald-600' : 'bg-red-100 border-red-300 text-red-600'}`}>
                                                {PackagingIcon && <div className="w-14 h-14">{<PackagingIcon />}</div>}
                                            </div>
                                            
                                            <div className="w-full flex flex-col justify-center">
                                                <h3 className="font-black text-slate-800 text-2xl sm:text-3xl leading-tight mb-4">{currentQuestion.title}</h3>
                                                
                                                {lastAnswerStatus === 'CORRECT' ? (
                                                    <div className="inline-flex items-center justify-center sm:justify-start px-5 py-2.5 bg-emerald-200 text-emerald-900 rounded-xl text-base font-black shadow-sm uppercase tracking-wider w-fit mx-auto sm:mx-0">
                                                        Masuk: {BINS.find(b => b.id === currentQuestion.correctAnswer).label} {BINS.find(b => b.id === currentQuestion.correctAnswer).icon}
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col gap-3 items-center sm:items-start">
                                                        <div className="inline-flex items-center px-4 py-2 bg-red-200 text-red-900 rounded-xl text-sm sm:text-base font-black shadow-sm uppercase w-fit line-through decoration-red-500 decoration-2">
                                                            Tebakanmu: {BINS.find(b => b.id === lastUserAnswer)?.label}
                                                        </div>
                                                        <div className="inline-flex items-center px-5 py-2.5 bg-emerald-200 text-emerald-900 rounded-xl text-sm sm:text-base font-black shadow-sm uppercase tracking-wider w-fit">
                                                            Seharusnya: {BINS.find(b => b.id === currentQuestion.correctAnswer).label} {BINS.find(b => b.id === currentQuestion.correctAnswer).icon}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="bg-white/80 p-5 sm:p-6 rounded-2xl border border-white shadow-sm backdrop-blur-sm">
                                            <p className="text-slate-800 text-lg sm:text-xl leading-relaxed font-bold">
                                                {currentQuestion.explanation}
                                            </p>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleNextAction} 
                                        className="w-full py-5 sm:py-6 bg-slate-800 text-white font-black text-xl sm:text-2xl rounded-2xl hover:bg-slate-700 shadow-[0_8px_0_rgb(51,65,85)] hover:shadow-[0_4px_0_rgb(51,65,85)] hover:translate-y-1 transition-all active:scale-95"
                                    >
                                        {currentQuestionIndex < 4 ? "Lanjut Kasus Berikutnya ➡️" : "Selesaikan Level Ini 🏁"}
                                    </button>
                                </div>
                            )}

                            {/* LAYAR RINGKASAN LEVEL */}
                            {gameState === 'LEVEL_COMPLETE' && (
                                <div className="text-center py-8 sm:py-12 animate-in fade-in duration-500 max-w-2xl mx-auto">
                                    <div className="text-7xl sm:text-8xl mb-6">🎖️</div>
                                    <h1 className="text-4xl sm:text-5xl font-black text-slate-800 mb-4 tracking-tight">Level {currentLevelIndex + 1} Cleared!</h1>
                                    <p className="text-xl text-slate-500 mb-10 font-medium">Kamu berhasil melewati 5 case-studies di tingkat {currentLevel.difficulty}.</p>
                                    
                                    <div className="bg-indigo-50 border-4 border-indigo-100 rounded-[2rem] p-8 mb-10 shadow-sm relative overflow-hidden">
                                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-indigo-200 rounded-full blur-3xl opacity-50"></div>
                                        <p className="text-sm font-black text-indigo-400 uppercase tracking-widest mb-2">Skor Level Ini</p>
                                        <div className="text-7xl sm:text-8xl font-black text-indigo-700 tracking-tighter">{levelScore} <span className="text-3xl text-indigo-400 font-bold">/ 50</span></div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                        <button 
                                            onClick={handleReplayLevel} 
                                            className="w-full py-5 bg-white border-4 border-slate-200 text-slate-700 font-black text-xl rounded-2xl hover:bg-slate-50 transition-all active:scale-95 shadow-sm"
                                        >
                                            🔄 Ulangi Level Ini
                                        </button>
                                        <button 
                                            onClick={handleNextLevel} 
                                            className="w-full py-5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-[0_8px_0_rgb(5,150,105)] hover:shadow-[0_4px_0_rgb(5,150,105)] hover:translate-y-1 transition-all"
                                        >
                                            {currentLevelIndex >= activeSessionLevels.length - 1 ? "Lihat Hasil Akhir 🌍" : "Gas Level " + (currentLevelIndex + 2) + " ➡️"}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* LAYAR EVALUASI AKHIR (VICTORY) */}
                            {gameState === 'VICTORY' && (
                                <div className="text-center py-6 md:py-12 animate-in fade-in slide-in-from-bottom-8 duration-700 max-w-3xl mx-auto">
                                    <h1 className="text-4xl md:text-5xl font-black text-emerald-600 mb-4 tracking-tight">IT'S A WRAP! 🎬</h1>
                                    <p className="text-lg sm:text-xl text-slate-500 mb-8 font-medium">Simulasi selesai, tapi impact desain kamu di dunia nyata baru aja dimulai.</p>
                                    
                                    <div className="bg-white border-4 border-emerald-100 rounded-[2.5rem] p-8 sm:p-10 mb-10 shadow-2xl relative overflow-hidden">
                                        <p className="text-base font-black text-slate-400 uppercase tracking-widest mb-3">Total Eco-Score Kamu</p>
                                        <div className="text-7xl sm:text-8xl font-black text-slate-800 mb-6 tracking-tighter">{score} <span className="text-3xl text-slate-400">/ 250</span></div>
                                        <div className="inline-block bg-emerald-100 text-emerald-800 px-6 py-3 rounded-2xl font-black text-lg uppercase tracking-wider shadow-sm border border-emerald-200">
                                            {score >= 200 ? "🌟 Fix Eco-Designer Sejati!" : score >= 100 ? "🛠️ Skill is on progress" : "⚠️ Butuh banyak belajar"}
                                        </div>
                                    </div>

                                    {/* FORM SUBMIT KE GOOGLE SHEETS */}
                                    <div className="bg-indigo-50 border-2 border-indigo-200 rounded-[2rem] p-6 sm:p-8 mb-10 shadow-sm text-left">
                                        <h3 className="text-2xl font-black text-indigo-900 mb-2">Simpan Skormu di Leaderboard! 🏆</h3>
                                        <p className="text-indigo-700 mb-6 font-medium">Catat namamu sebagai desainer yang peduli lingkungan.</p>
                                        
                                        {submitStatus === 'SUCCESS' ? (
                                            <div className="bg-emerald-100 text-emerald-800 p-4 rounded-xl font-bold flex items-center">
                                                <span className="mr-2 text-2xl">🎉</span> Mantap! Skor kamu udah kecatet di sistem.
                                            </div>
                                        ) : (
                                            <form onSubmit={handleSaveScore} className="flex flex-col sm:flex-row gap-4">
                                                <input 
                                                    type="text" 
                                                    required
                                                    value={playerName}
                                                    onChange={(e) => setPlayerName(e.target.value)}
                                                    placeholder="Masukkan namamu (ex: Budi Desainer)" 
                                                    className="flex-grow px-5 py-4 rounded-xl border-2 border-indigo-200 focus:outline-none focus:border-indigo-500 font-bold text-slate-800"
                                                    disabled={isSubmitting}
                                                />
                                                <button 
                                                    type="submit" 
                                                    disabled={isSubmitting || !playerName.trim()}
                                                    className="px-8 py-4 bg-indigo-600 text-white font-black rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-md shrink-0"
                                                >
                                                    {isSubmitting ? "Menyimpan..." : "Simpan Skor"}
                                                </button>
                                            </form>
                                        )}
                                        {submitStatus === 'ERROR' && (
                                            <p className="text-red-500 mt-3 font-bold text-sm">Gagal menyimpan skor. Coba lagi ya.</p>
                                        )}
                                    </div>

                                    {/* RESTORED: KESIMPULAN GEN-Z & KATEGORI SAMPAH */}
                                    <div className="text-left bg-white rounded-[2rem] p-6 md:p-10 border-2 border-slate-200 mb-10 shadow-sm">
                                        <h2 className="text-2xl sm:text-3xl font-black text-slate-800 mb-6 flex items-center tracking-tight">
                                            <span className="text-4xl mr-3">☕</span> Spill the Tea: Realita Pabrik Sampah
                                        </h2>

                                        <div className="space-y-5 mb-8">
                                            <div className="flex flex-col sm:flex-row bg-blue-50/50 p-5 rounded-2xl border-2 border-blue-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">📄</span>
                                                <div>
                                                    <h3 className="font-black text-blue-800 text-xl mb-1 uppercase tracking-wide">Tong Biru (Kertas)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Sirkular abis. Tapi <b>pantangan terbesarnya: Laminasi glossy/plastik</b>. Kertas kalau udah dilaminasi bakal di-reject pabrik karena nggak bisa lebur jadi bubur pulp.</p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-yellow-50/50 p-5 rounded-2xl border-2 border-yellow-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">♻️</span>
                                                <div>
                                                    <h3 className="font-black text-yellow-800 text-xl mb-1 uppercase tracking-wide">Tong Kuning (Anorganik)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Harta karunnya kang loak. Botol PET bening, kaca polos, aluminium murni. <b>Kuncinya: Monomaterial (cuma 1 jenis bahan) dan gampang dicuci.</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-red-50/50 p-5 rounded-2xl border-2 border-red-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">☠️</span>
                                                <div>
                                                    <h3 className="font-black text-red-800 text-xl mb-1 uppercase tracking-wide">Tong Merah (B3)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Red flag zone. Kaleng aerosol bertekanan, sisa aseton/alkohol, atau bahan kimia keras. Wajib pisah tong biar <b>nggak meledak atau ngeracunin tanah.</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-slate-100/50 p-5 rounded-2xl border-2 border-slate-200">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">🗑️</span>
                                                <div>
                                                    <h3 className="font-black text-slate-700 text-xl mb-1 uppercase tracking-wide">Tong Abu-abu (Residu)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Toxic trait industri: <b>Sachet & Multilayer</b>. Ukurannya terlalu kecil buat disortir mesin, atau plastiknya kecampur logam jadi mustahil dipisah. Fix numpuk di laut selamanya.</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 text-emerald-50 p-6 rounded-2xl shadow-inner">
                                            <h3 className="font-black text-lg mb-2 text-emerald-400">💡 Reminder buat Kamu</h3>
                                            <p className="text-sm leading-relaxed opacity-90">
                                                "Sekitar 80% dampak lingkungan dari sebuah produk itu ditentukan di tangan desainer pas lagi mikirin konsep. Jadilah desainer yang *mindful*. Bikin kemasan yang nggak cuma cantik pas di-<i>unboxing</i>, tapi juga mati dengan anggun (sirkular) pas dibuang."
                                            </p>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row justify-center gap-5 mt-10">
                                        <button onClick={startGame} className="w-full sm:w-1/2 py-5 bg-slate-800 text-white font-black text-xl rounded-2xl shadow-[0_8px_0_rgb(51,65,85)] hover:shadow-[0_4px_0_rgb(51,65,85)] hover:translate-y-1 transition-all">
                                            Main Ulang (Soal Diacak) 🔄
                                        </button>
                                        <button onClick={handleShareWA} className="w-full sm:w-1/2 py-5 bg-emerald-500 text-white font-black text-xl rounded-2xl shadow-[0_8px_0_rgb(5,150,105)] hover:shadow-[0_4px_0_rgb(5,150,105)] hover:translate-y-1 transition-all flex items-center justify-center space-x-2">
                                            <span className="text-2xl">💬</span>
                                            <span>Share ke WA</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
